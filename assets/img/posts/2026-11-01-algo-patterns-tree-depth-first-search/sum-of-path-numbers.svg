<svg xmlns="http://www.w3.org/2000/svg" width="700" height="390" viewBox="0 0 700 390" role="img" aria-labelledby="title desc" style="width:100%;height:auto;background:#fff">
<rect x="0" y="0" width="100%" height="100%" fill="#fff"/>
  <title id="title">Числа, образованные путями дерева</title>
  <desc id="desc">Пути образуют числа 101, 116 и 115, сумма которых равна 332.</desc>
  <style>
    .edge{stroke:#64748b;stroke-width:3}.node{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.value{font:700 18px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#172554;text-anchor:middle;dominant-baseline:middle}.tag{font:700 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#166534;text-anchor:middle}.sum{font:700 18px system-ui,sans-serif;fill:#172554;text-anchor:middle}
  </style>
  <path class="edge" fill="none" d="M350 78L220 142M350 78L480 142M220 178L150 242M480 178L410 242M480 178L550 242"/>
  <g><circle class="node" cx="350" cy="60" r="26"/><text class="value" x="350" y="60">1</text></g>
  <g><circle class="node" cx="220" cy="160" r="26"/><text class="value" x="220" y="160">0</text></g>
  <g><circle class="node" cx="480" cy="160" r="26"/><text class="value" x="480" y="160">1</text></g>
  <g><circle class="node" cx="150" cy="260" r="26"/><text class="value" x="150" y="260">1</text></g>
  <g><circle class="node" cx="410" cy="260" r="26"/><text class="value" x="410" y="260">6</text></g>
  <g><circle class="node" cx="550" cy="260" r="26"/><text class="value" x="550" y="260">5</text></g>
  <text class="tag" x="150" y="315">101</text>
  <text class="tag" x="410" y="315">116</text>
  <text class="tag" x="550" y="315">115</text>
  <text class="sum" x="350" y="365">101 + 116 + 115 = 332</text>
</svg>
