<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360" role="img" aria-labelledby="title desc" style="width:100%;height:auto;background:#fff">
<rect x="0" y="0" width="100%" height="100%" fill="#fff"/>
  <title id="title">Путь в бинарном дереве с суммой 23</title>
  <desc id="desc">Зелёным выделен путь 12, 1, 10 от корня до листа.</desc>
  <style>
    .edge{stroke:#64748b;stroke-width:3}.path{stroke:#16a34a;stroke-width:7;stroke-linecap:round}.node{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.chosen{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.value{font:700 18px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#172554;text-anchor:middle;dominant-baseline:middle}.label{font:600 18px system-ui,sans-serif;fill:#166534;text-anchor:middle}
  </style>
  <g fill="none">
    <path class="edge" d="M350 78L220 142M350 78L480 142M220 178L150 242M480 178L410 242M480 178L550 242"/>
    <path class="path" d="M350 78L480 142M480 178L410 242"/>
  </g>
  <g><circle class="chosen" cx="350" cy="60" r="26"/><text class="value" x="350" y="60">12</text></g>
  <g><circle class="node" cx="220" cy="160" r="26"/><text class="value" x="220" y="160">7</text></g>
  <g><circle class="chosen" cx="480" cy="160" r="26"/><text class="value" x="480" y="160">1</text></g>
  <g><circle class="node" cx="150" cy="260" r="26"/><text class="value" x="150" y="260">9</text></g>
  <g><circle class="chosen" cx="410" cy="260" r="26"/><text class="value" x="410" y="260">10</text></g>
  <g><circle class="node" cx="550" cy="260" r="26"/><text class="value" x="550" y="260">5</text></g>
  <text class="label" x="350" y="330">12 + 1 + 10 = 23</text>
</svg>
