<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1290" viewBox="0 0 360 1290" role="img" aria-labelledby="title desc">
  <title id="title">Балансировка двух куч для потока чисел</title>
  <desc id="desc">Пять вертикально расположенных шагов добавления чисел 3, 1, 5 и 4. Меньшая половина хранится в максимальной куче, большая — в минимальной.</desc>
  <defs>
    <style>
      .card { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .heading { fill: #0f172a; font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #334155; font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .note { fill: #475569; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .median { fill: #0f172a; font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .max-node { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .min-node { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .value { fill: #0f172a; font: 700 17px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; dominant-baseline: central; }
      .edge { stroke: #64748b; stroke-width: 2; }
      .move { fill: none; stroke: #d97706; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="360" height="1290" fill="#ffffff"/>
  <text x="180" y="32" class="heading" text-anchor="middle">Поток: 3 → 1 → 5 → 4</text>

  <g transform="translate(16 52)">
    <rect class="card" width="328" height="235" rx="14"/>
    <text x="164" y="30" class="heading" text-anchor="middle">1. Добавляем 3</text>
    <text x="20" y="68" class="label">maxHeap</text>
    <text x="184" y="68" class="label">minHeap</text>
    <circle class="max-node" cx="82" cy="122" r="24"/>
    <text class="value" x="82" y="122">3</text>
    <text x="246" y="126" class="note" text-anchor="middle">пусто</text>
    <text x="164" y="210" class="median" text-anchor="middle">медиана = 3</text>
  </g>

  <g transform="translate(16 300)">
    <rect class="card" width="328" height="235" rx="14"/>
    <text x="164" y="30" class="heading" text-anchor="middle">2. Добавляем 1</text>
    <text x="20" y="68" class="label">maxHeap</text>
    <text x="184" y="68" class="label">minHeap</text>
    <line class="edge" x1="82" y1="118" x2="82" y2="150"/>
    <circle class="max-node" cx="82" cy="100" r="24"/>
    <text class="value" x="82" y="100">3</text>
    <circle class="max-node" cx="82" cy="168" r="24"/>
    <text class="value" x="82" y="168">1</text>
    <text x="246" y="126" class="note" text-anchor="middle">пусто</text>
    <text x="164" y="216" class="median" text-anchor="middle">нужен баланс</text>
  </g>

  <g transform="translate(16 548)">
    <rect class="card" width="328" height="235" rx="14"/>
    <text x="164" y="30" class="heading" text-anchor="middle">3. Балансируем</text>
    <text x="20" y="68" class="label">maxHeap</text>
    <text x="184" y="68" class="label">minHeap</text>
    <circle class="max-node" cx="82" cy="122" r="24"/>
    <text class="value" x="82" y="122">1</text>
    <circle class="min-node" cx="246" cy="122" r="24"/>
    <text class="value" x="246" y="122">3</text>
    <path class="move" d="M 112 104 C 150 76, 194 76, 218 104"/>
    <text x="164" y="172" class="note" text-anchor="middle">переносим 3</text>
    <text x="164" y="210" class="median" text-anchor="middle">медиана = 2</text>
  </g>

  <g transform="translate(16 796)">
    <rect class="card" width="328" height="235" rx="14"/>
    <text x="164" y="30" class="heading" text-anchor="middle">4. Добавляем 5</text>
    <text x="20" y="68" class="label">maxHeap</text>
    <text x="184" y="68" class="label">minHeap</text>
    <line class="edge" x1="82" y1="118" x2="58" y2="150"/>
    <circle class="max-node" cx="82" cy="100" r="24"/>
    <text class="value" x="82" y="100">3</text>
    <circle class="max-node" cx="58" cy="168" r="24"/>
    <text class="value" x="58" y="168">1</text>
    <circle class="min-node" cx="246" cy="122" r="24"/>
    <text class="value" x="246" y="122">5</text>
    <text x="164" y="210" class="median" text-anchor="middle">медиана = 3</text>
  </g>

  <g transform="translate(16 1044)">
    <rect class="card" width="328" height="235" rx="14"/>
    <text x="164" y="30" class="heading" text-anchor="middle">5. Добавляем 4</text>
    <text x="20" y="68" class="label">maxHeap</text>
    <text x="184" y="68" class="label">minHeap</text>
    <line class="edge" x1="82" y1="118" x2="58" y2="150"/>
    <circle class="max-node" cx="82" cy="100" r="24"/>
    <text class="value" x="82" y="100">3</text>
    <circle class="max-node" cx="58" cy="168" r="24"/>
    <text class="value" x="58" y="168">1</text>
    <line class="edge" x1="246" y1="118" x2="270" y2="150"/>
    <circle class="min-node" cx="246" cy="100" r="24"/>
    <text class="value" x="246" y="100">4</text>
    <circle class="min-node" cx="270" cy="168" r="24"/>
    <text class="value" x="270" y="168">5</text>
    <text x="164" y="216" class="median" text-anchor="middle">медиана = 3,5</text>
  </g>
</svg>
