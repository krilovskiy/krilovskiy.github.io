<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Балансировка двух куч для потока чисел</title>
  <desc id="desc">Пять шагов добавления чисел 3, 1, 5 и 4. Меньшая половина хранится в максимальной куче, большая — в минимальной.</desc>
  <defs>
    <style>
      .card { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .heading { fill: #0f172a; font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #334155; font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .note { fill: #475569; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .median { fill: #0f172a; font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .max-node { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .min-node { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .value { fill: #0f172a; font: 700 17px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; dominant-baseline: central; }
      .edge { stroke: #64748b; stroke-width: 2; }
      .move { fill: none; stroke: #d97706; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1100" height="500" fill="#ffffff"/>
  <text x="550" y="34" class="heading" text-anchor="middle">Поток: 3 → 1 → 5 → 4</text>

  <g transform="translate(18 58)">
    <rect class="card" width="198" height="414" rx="14"/>
    <text x="99" y="32" class="heading" text-anchor="middle">1. Добавляем 3</text>
    <text x="16" y="70" class="label">maxHeap</text>
    <circle class="max-node" cx="99" cy="112" r="24"/>
    <text class="value" x="99" y="112">3</text>
    <text x="16" y="190" class="label">minHeap</text>
    <text x="99" y="228" class="note" text-anchor="middle">пусто</text>
    <text x="99" y="382" class="median" text-anchor="middle">медиана = 3</text>
  </g>

  <g transform="translate(234 58)">
    <rect class="card" width="198" height="414" rx="14"/>
    <text x="99" y="32" class="heading" text-anchor="middle">2. Добавляем 1</text>
    <text x="16" y="70" class="label">maxHeap</text>
    <line class="edge" x1="99" y1="132" x2="62" y2="168"/>
    <circle class="max-node" cx="99" cy="112" r="24"/>
    <text class="value" x="99" y="112">3</text>
    <circle class="max-node" cx="62" cy="184" r="24"/>
    <text class="value" x="62" y="184">1</text>
    <text x="16" y="250" class="label">minHeap</text>
    <text x="99" y="288" class="note" text-anchor="middle">пусто</text>
    <text x="99" y="382" class="median" text-anchor="middle">нужен баланс</text>
  </g>

  <g transform="translate(450 58)">
    <rect class="card" width="198" height="414" rx="14"/>
    <text x="99" y="32" class="heading" text-anchor="middle">3. Балансируем</text>
    <text x="16" y="70" class="label">maxHeap</text>
    <circle class="max-node" cx="58" cy="112" r="24"/>
    <text class="value" x="58" y="112">1</text>
    <text x="16" y="190" class="label">minHeap</text>
    <circle class="min-node" cx="140" cy="232" r="24"/>
    <text class="value" x="140" y="232">3</text>
    <path class="move" d="M 84 145 C 112 150, 126 174, 134 200"/>
    <text x="99" y="304" class="note" text-anchor="middle">переносим 3</text>
    <text x="99" y="382" class="median" text-anchor="middle">медиана = 2</text>
  </g>

  <g transform="translate(666 58)">
    <rect class="card" width="198" height="414" rx="14"/>
    <text x="99" y="32" class="heading" text-anchor="middle">4. Добавляем 5</text>
    <text x="16" y="70" class="label">maxHeap</text>
    <line class="edge" x1="68" y1="132" x2="42" y2="164"/>
    <circle class="max-node" cx="68" cy="112" r="24"/>
    <text class="value" x="68" y="112">3</text>
    <circle class="max-node" cx="42" cy="184" r="24"/>
    <text class="value" x="42" y="184">1</text>
    <text x="16" y="250" class="label">minHeap</text>
    <circle class="min-node" cx="140" cy="292" r="24"/>
    <text class="value" x="140" y="292">5</text>
    <text x="99" y="382" class="median" text-anchor="middle">медиана = 3</text>
  </g>

  <g transform="translate(882 58)">
    <rect class="card" width="198" height="414" rx="14"/>
    <text x="99" y="32" class="heading" text-anchor="middle">5. Добавляем 4</text>
    <text x="16" y="70" class="label">maxHeap</text>
    <line class="edge" x1="58" y1="132" x2="36" y2="164"/>
    <circle class="max-node" cx="58" cy="112" r="24"/>
    <text class="value" x="58" y="112">3</text>
    <circle class="max-node" cx="36" cy="184" r="24"/>
    <text class="value" x="36" y="184">1</text>
    <text x="16" y="230" class="label">minHeap</text>
    <line class="edge" x1="140" y1="282" x2="164" y2="314"/>
    <circle class="min-node" cx="140" cy="262" r="24"/>
    <text class="value" x="140" y="262">4</text>
    <circle class="min-node" cx="164" cy="334" r="24"/>
    <text class="value" x="164" y="334">5</text>
    <text x="99" y="392" class="median" text-anchor="middle">медиана = 3,5</text>
  </g>
</svg>
